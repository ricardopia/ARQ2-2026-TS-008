server {
    listen 8080;

    # Core API
    location /api/v1/ {
        proxy_pass http://core-api:8080;
    }

    # Realtime Service
    location /ws/ {
        proxy_pass http://realtime-service:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Healthcheck
    location /health {
        return 200 '{"status":"healthy"}';
    }
}
