global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: outbox-relay
    static_configs:
      - targets:
          - outbox-relay:8081

  - job_name: core-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - core-api:8080

  - job_name: file-worker
    static_configs:
      - targets:
          - file-worker:8082

  - job_name: realtime-service
    static_configs:
      - targets:
          - realtime-service:8083

  # RabbitMQ (rabbitmq_prometheus plugin, port 15692). The detailed endpoint
  # exposes one series per queue, which the dead-letter alert needs.
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - rabbitmq:15692

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
    static_configs:
      - targets:
          - rabbitmq:15692

