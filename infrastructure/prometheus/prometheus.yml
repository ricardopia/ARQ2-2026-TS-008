global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: outbox-relay
    static_configs:
      - targets:
          - outbox-relay:8081

  - job_name: core-api
    static_configs:
      - targets:
          - core-api:8080
        metrics_path: /api/v1/metrics
